### Parser SFT on the best-of-K targets from vqs/select_parser_targets.py (paper Sec. 4):
### full fine-tune with the vision tower frozen, per-device batch 4 with 8 gradient-accumulation
### steps, learning rate 1e-5, 2 epochs.
###
###   llamafactory-cli train configs/parser_sft.yaml
###   (run from the repository root, after select_parser_targets.py has written data/parser_sft)
###
### A full fine-tune does not save chat_template.json; copy the base model's into runs/parser_sft
### before serving the parser (see the README).
model_name_or_path: Qwen/Qwen3-VL-2B-Instruct
trust_remote_code: true
image_max_pixels: 1003520          # the resolution parse_images.py parses at

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: false
template: qwen3_vl_nothink

### dataset
dataset: parser_sft
dataset_dir: data/parser_sft
# image tokens count toward cutoff_len; at 1003520 pixels an image is ~1.3k tokens and a parse
# target can reach 2k, so a short cutoff silently truncates the target being trained on
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: runs/parser_sft
logging_steps: 5
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
seed: 1
